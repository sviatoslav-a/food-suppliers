[project]
name = "food-suppliers"
version = "0.1.0"
description = "Scout: search and compare food suppliers for restaurants"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "mcp>=2.3.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "selectolax>=1.0.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-playwright>=0.10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
